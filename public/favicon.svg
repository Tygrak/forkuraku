<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="forkuraku">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24263f"/>
      <stop offset="1" stop-color="#0f1019"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>

  <!-- fork, behind the carrot -->
  <g fill="#f3ead8">
    <rect x="30" y="31" width="5" height="26" rx="2.5"/>
    <rect x="20" y="27" width="25" height="5" rx="2.5"/>
    <rect x="20" y="4" width="4" height="25" rx="2"/>
    <rect x="27" y="3" width="4" height="26" rx="2"/>
    <rect x="34" y="4" width="4" height="25" rx="2"/>
    <rect x="41" y="5" width="4" height="24" rx="2"/>
  </g>


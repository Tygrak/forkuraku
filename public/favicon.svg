    <path d="M53 21c5-3 10-4 12-3-3 5-7 7-11 6z" fill="#65c94d"/>
    <path d="M19 17h27" fill="none" stroke="#f08a2c" stroke-width="2" stroke-linecap="round" opacity=".65"/>
    <path d="M21 22h24" fill="none" stroke="#f08a2c" stroke-width="2" stroke-linecap="round" opacity=".5"/>
  </g>
</svg>
